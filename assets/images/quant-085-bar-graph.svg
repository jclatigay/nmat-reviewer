<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 520 320"
width="520"
height="320">

<style>
.title{font:600 16px Arial,sans-serif;fill:#1A365D}
.axis{stroke:#475569;stroke-width:2}
.grid{stroke:#E2E8F0}
.bar{fill:#2563EB}
.label{font:12px Arial,sans-serif;fill:#64748B}
.value{font:600 12px Arial,sans-serif;fill:#1E293B}
.dept{font:12px Arial,sans-serif;fill:#334155}
</style>

<rect x="2" y="2" width="516" height="316"
rx="12"
fill="#FFF"
stroke="#CBD5E0"
stroke-width="2"/>

<text class="title" x="24" y="30">
Weekly Patient Admissions by Department
</text>

<!-- grid (0 to 140, step 35) -->
<line class="grid" x1="70" y1="260" x2="470" y2="260"/>
<line class="grid" x1="70" y1="210" x2="470" y2="210"/>
<line class="grid" x1="70" y1="160" x2="470" y2="160"/>
<line class="grid" x1="70" y1="110" x2="470" y2="110"/>
<line class="grid" x1="70" y1="60" x2="470" y2="60"/>

<!-- axes -->
<line class="axis" x1="70" y1="60" x2="70" y2="260"/>
<line class="axis" x1="70" y1="260" x2="470" y2="260"/>

<!-- y labels -->
<text class="label" x="40" y="264">0</text>
<text class="label" x="34" y="214">35</text>
<text class="label" x="34" y="164">70</text>
<text class="label" x="28" y="114">105</text>
<text class="label" x="28" y="64">140</text>

<!-- bars: ER 85, OPD 120, Peds 60, Surgery 95 -->
<rect class="bar" x="100" y="139" width="48" height="121"/>
<rect class="bar" x="180" y="89" width="48" height="171"/>
<rect class="bar" x="260" y="174" width="48" height="86"/>
<rect class="bar" x="340" y="124" width="48" height="136"/>

<!-- values -->
<text class="value" x="124" y="131" text-anchor="middle">85</text>
<text class="value" x="204" y="81" text-anchor="middle">120</text>
<text class="value" x="284" y="166" text-anchor="middle">60</text>
<text class="value" x="364" y="116" text-anchor="middle">95</text>

<!-- departments -->
<text class="dept" x="124" y="280" text-anchor="middle">ER</text>
<text class="dept" x="204" y="280" text-anchor="middle">OPD</text>
<text class="dept" x="284" y="280" text-anchor="middle">Peds</text>
<text class="dept" x="364" y="280" text-anchor="middle">Surgery</text>

</svg>