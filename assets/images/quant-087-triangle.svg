<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 520 320"
width="520"
height="320">

<style>
.shape{fill:#DBEAFE;stroke:#2563EB;stroke-width:2.5}
.dash{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:5,4}
.label{font:600 14px Arial,sans-serif;fill:#1E293B}
.rightangle{fill:none;stroke:#64748B;stroke-width:1.5}
</style>

<rect x="2" y="2" width="516" height="316"
rx="12"
fill="#FFF"
stroke="#CBD5E0"
stroke-width="2"/>

<!-- triangular garden: base at bottom, apex offset to show a scalene look -->
<polygon class="shape" points="140,240 400,240 300,80"/>

<!-- dashed height line from apex to base -->
<line class="dash" x1="300" y1="80" x2="300" y2="240"/>
<polyline class="rightangle" points="292,240 292,232 300,232"/>

<!-- base label -->
<text class="label" x="270" y="266" text-anchor="middle">base = 18 m</text>

<!-- height label -->
<text class="label" x="330" y="165" text-anchor="middle">height = ?</text>

</svg>