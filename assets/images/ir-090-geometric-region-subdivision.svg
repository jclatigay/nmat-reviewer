  <text x="837.0" y="130" font-size="16" text-anchor="middle" fill="#111">(E)</text>
  <g transform="translate(837, 63)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#111" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#111" stroke-width="2"/>
