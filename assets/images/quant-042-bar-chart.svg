<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 520 320"
width="520"
height="320">

<style>
.title{font:600 16px Arial,sans-serif;fill:#1A365D}
.axis{stroke:#475569;stroke-width:2}
.grid{stroke:#E2E8F0}
.bar{fill:#2563EB}
.label{font:12px Arial,sans-serif;fill:#64748B}
.value{font:600 12px Arial,sans-serif;fill:#1E293B}
.month{font:12px Arial,sans-serif;fill:#334155}
</style>

<rect x="2" y="2" width="516" height="316"
rx="12"
fill="#FFF"
stroke="#CBD5E0"
stroke-width="2"/>

<text class="title" x="24" y="30">
Books Sold
</text>

<!-- grid -->
<line class="grid" x1="70" y1="260" x2="470" y2="260"/>
<line class="grid" x1="70" y1="210" x2="470" y2="210"/>
<line class="grid" x1="70" y1="160" x2="470" y2="160"/>
<line class="grid" x1="70" y1="110" x2="470" y2="110"/>
<line class="grid" x1="70" y1="60" x2="470" y2="60"/>

<!-- axes -->
<line class="axis" x1="70" y1="60" x2="70" y2="260"/>
<line class="axis" x1="70" y1="260" x2="470" y2="260"/>

<!-- y labels -->
<text class="label" x="40" y="264">0</text>
<text class="label" x="34" y="214">50</text>
<text class="label" x="28" y="164">100</text>
<text class="label" x="28" y="114">150</text>
<text class="label" x="28" y="64">200</text>

<!-- bars -->
<rect class="bar" x="100" y="140" width="48" height="120"/>
<rect class="bar" x="180" y="120" width="48" height="140"/>
<rect class="bar" x="260" y="80" width="48" height="180"/>
<rect class="bar" x="340" y="100" width="48" height="160"/>

<!-- values -->
<text class="value" x="124" y="132" text-anchor="middle">120</text>
<text class="value" x="204" y="112" text-anchor="middle">140</text>
<text class="value" x="284" y="72" text-anchor="middle">180</text>
<text class="value" x="364" y="92" text-anchor="middle">160</text>

<!-- months -->
<text class="month" x="124" y="280" text-anchor="middle">Jan</text>
<text class="month" x="204" y="280" text-anchor="middle">Feb</text>
<text class="month" x="284" y="280" text-anchor="middle">Mar</text>
<text class="month" x="364" y="280" text-anchor="middle">Apr</text>

</svg>