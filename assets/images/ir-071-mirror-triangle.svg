<svg viewBox="0 0 570 150" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Define the single base complex shape -->
  <defs>
    <g id="complex_shape_base">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#111" stroke-width="1.5"/>
      <path d="M -25,25 L 25,-25" fill="none" stroke="#111" stroke-width="1.5"/>
      <path d="M 0,20 L -15,0 L 0,-20 Z" fill="none" stroke="#111" stroke-width="1.5"/> 
    </g>
  </defs>

  <!-- Option (A) - Rotated 90 deg -->
  <rect x="20" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="65.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(A)</text>
  <use href="#complex_shape_base" transform="translate(65, 63) rotate(90)" />

  <!-- Option (B) - Base (0 deg) -->
  <rect x="126" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="171.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(B)</text>
  <use href="#complex_shape_base" transform="translate(171, 63) rotate(0)" />

  <!-- Option (C) [ODD ONE OUT] - True Mirror Image of the entire shape -->
  <rect x="232" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="277.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(C)</text>
  <use href="#complex_shape_base" transform="translate(277, 63) scale(-1, 1)" />

  <!-- Option (D) - Rotated 180 deg -->
  <rect x="338" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="383.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(D)</text>
  <use href="#complex_shape_base" transform="translate(383, 63) rotate(180)" />

  <!-- Option (E) - Rotated -90 (or 270) deg -->
  <rect x="444" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="489.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(E)</text>
  <use href="#complex_shape_base" transform="translate(489, 63) rotate(-90)" />
</svg>
