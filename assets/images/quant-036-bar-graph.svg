<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 320"
     width="520"
     height="320"
     shape-rendering="geometricPrecision">

<style>
.title{
    font:600 16px Arial,sans-serif;
    fill:#1A365D;
}

.axis{
    stroke:#475569;
    stroke-width:2;
}

.grid{
    stroke:#E2E8F0;
    stroke-width:1;
}

.label{
    font:12px Arial,sans-serif;
    fill:#64748B;
}

.month{
    font:12px Arial,sans-serif;
    fill:#334155;
}

.value{
    font:600 12px Arial,sans-serif;
    fill:#1E293B;
}

.axisLabel{
    font:13px Arial,sans-serif;
    fill:#334155;
}

.bar{
    fill:#2563EB;
}
</style>

<!-- Card -->
<rect
    x="2"
    y="2"
    width="516"
    height="316"
    rx="12"
    fill="#FFFFFF"
    stroke="#CBD5E0"
    stroke-width="2"/>

<!-- Title -->
<text class="title" x="24" y="30">
Monthly Sales
</text>

<!-- Horizontal Grid -->
<line class="grid" x1="70" y1="260" x2="470" y2="260"/>
<line class="grid" x1="70" y1="210" x2="470" y2="210"/>
<line class="grid" x1="70" y1="160" x2="470" y2="160"/>
<line class="grid" x1="70" y1="110" x2="470" y2="110"/>
<line class="grid" x1="70" y1="60"  x2="470" y2="60"/>

<!-- Axes -->
<line class="axis" x1="70" y1="260" x2="470" y2="260"/>
<line class="axis" x1="70" y1="60" x2="70" y2="260"/>

<!-- Y Labels -->
<text class="label" x="44" y="264">0</text>
<text class="label" x="36" y="214">50</text>
<text class="label" x="28" y="164">100</text>
<text class="label" x="28" y="114">150</text>
<text class="label" x="28" y="64">200</text>

<!-- Bars -->
<rect class="bar" x="100" y="140" width="50" height="120" rx="2"/>
<rect class="bar" x="180" y="110" width="50" height="150" rx="2"/>
<rect class="bar" x="260" y="80" width="50" height="180" rx="2"/>
<rect class="bar" x="340" y="100" width="50" height="160" rx="2"/>

<!-- Values -->
<text class="value" x="125" y="132" text-anchor="middle">120</text>
<text class="value" x="205" y="102" text-anchor="middle">150</text>
<text class="value" x="285" y="72" text-anchor="middle">180</text>
<text class="value" x="365" y="92" text-anchor="middle">160</text>

<!-- Month Labels -->
<text class="month" x="125" y="280" text-anchor="middle">Jan</text>
<text class="month" x="205" y="280" text-anchor="middle">Feb</text>
<text class="month" x="285" y="280" text-anchor="middle">Mar</text>
<text class="month" x="365" y="280" text-anchor="middle">Apr</text>

<!-- Axis Labels -->
<text class="axisLabel"
      x="270"
      y="304"
      text-anchor="middle">
Months
</text>

<text class="axisLabel"
      transform="translate(18 170) rotate(-90)"
      text-anchor="middle">
Sales
</text>

</svg>