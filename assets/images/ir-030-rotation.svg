<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <rect x="1" y="1" width="418" height="118" rx="12" fill="#fff" stroke="#cbd5e0"/>
  <g font-family="sans-serif" font-size="14" fill="#1a365d">
    <text x="42" y="22">A</text>
    <text x="142" y="22">B</text>
    <text x="242" y="22">C</text>
    <text x="342" y="22">D</text>
  </g>

  <!-- A: up -->
  <circle cx="54" cy="62" r="28" fill="none" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="54" y1="80" x2="54" y2="44" stroke="#1a365d" stroke-width="4" stroke-linecap="round"/>
  <polygon points="54,34 46,48 62,48" fill="#1a365d"/>

  <!-- B: diagonal (odd one out) -->
  <circle cx="154" cy="62" r="28" fill="none" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="138" y1="78" x2="170" y2="46" stroke="#1a365d" stroke-width="4" stroke-linecap="round"/>
  <polygon points="180,36 166,50 174,58" fill="#1a365d"/>

  <!-- C: right -->
  <circle cx="254" cy="62" r="28" fill="none" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="238" y1="62" x2="274" y2="62" stroke="#1a365d" stroke-width="4" stroke-linecap="round"/>
  <polygon points="284,62 270,54 270,70" fill="#1a365d"/>

  <!-- D: down -->
  <circle cx="354" cy="62" r="28" fill="none" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="354" y1="44" x2="354" y2="80" stroke="#1a365d" stroke-width="4" stroke-linecap="round"/>
  <polygon points="354,90 346,76 362,76" fill="#1a365d"/>
</svg>
