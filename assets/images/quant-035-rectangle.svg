<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="5" refY="5"
            orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
        </marker>
    </defs>

    <!-- Title -->
    <text
        x="350"
        y="40"
        text-anchor="middle"
        font-size="26"
        font-family="Arial"
        font-weight="bold">
        Perimeter = 46 cm
    </text>

    <!-- Rectangle -->
    <rect
        x="170"
        y="90"
        width="360"
        height="180"
        fill="#f5f8ff"
        stroke="#222"
        stroke-width="3"/>

    <!-- Length Dimension -->
    <line
        x1="170"
        y1="310"
        x2="530"
        y2="310"
        stroke="#333"
        stroke-width="2"
        marker-start="url(#arrow)"
        marker-end="url(#arrow)"/>

    <text
        x="350"
        y="340"
        text-anchor="middle"
        font-size="20"
        font-family="Arial">
        Length = 15 cm
    </text>

    <!-- Width Dimension -->
    <line
        x1="130"
        y1="90"
        x2="130"
        y2="270"
        stroke="#333"
        stroke-width="2"
        marker-start="url(#arrow)"
        marker-end="url(#arrow)"/>

    <text
        x="65"
        y="165"
        text-anchor="middle"
        font-size="20"
        font-family="Arial">
        Width = ?
    </text>

    <text
        x="65"
        y="190"
        text-anchor="middle"
        font-size="20"
        font-family="Arial">
        cm
    </text>

    <!-- Prompt -->
    <text
        x="350"
        y="390"
        text-anchor="middle"
        font-size="22"
        font-family="Arial"
        font-weight="bold">
        Find the area of the rectangle.
    </text>

</svg>