<svg viewBox="0 0 570 150" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Define the base molecule and its mirror image for precise rendering -->
  <defs>
    <!-- Base Shape -->
    <g id="molecule_base">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#111" stroke-width="2"/>
      <!-- Arm 1: UP, Shaded on the LEFT -->
      <g>
        <line x1="0" y1="-14" x2="0" y2="-28" stroke="#111" stroke-width="2"/>
        <circle cx="0" cy="-38" r="10" fill="none" stroke="#111" stroke-width="2"/>
        <path d="M 0,-48 A 10,10 0 0,0 0,-28 Z" fill="#111"/> 
      </g>
      <!-- Arm 2: 135 deg Clockwise (DOWN-RIGHT), Shaded OUTWARD (Top half relative to arm) -->
      <g transform="rotate(135)">
        <line x1="0" y1="-14" x2="0" y2="-28" stroke="#111" stroke-width="2"/>
        <circle cx="0" cy="-38" r="10" fill="none" stroke="#111" stroke-width="2"/>
        <path d="M -10,-38 A 10,10 0 0,1 10,-38 Z" fill="#111"/> 
      </g>
    </g>

    <!-- Mirror Shape (Odd One Out) -->
    <g id="molecule_mirror">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#111" stroke-width="2"/>
      <!-- Arm 1: UP, Shaded on the RIGHT (Mirrored X) -->
      <g>
        <line x1="0" y1="-14" x2="0" y2="-28" stroke="#111" stroke-width="2"/>
        <circle cx="0" cy="-38" r="10" fill="none" stroke="#111" stroke-width="2"/>
        <path d="M 0,-48 A 10,10 0 0,1 0,-28 Z" fill="#111"/> 
      </g>
      <!-- Arm 2: -135 deg Clockwise (DOWN-LEFT), Shaded OUTWARD -->
      <g transform="rotate(-135)">
        <line x1="0" y1="-14" x2="0" y2="-28" stroke="#111" stroke-width="2"/>
        <circle cx="0" cy="-38" r="10" fill="none" stroke="#111" stroke-width="2"/>
        <path d="M -10,-38 A 10,10 0 0,1 10,-38 Z" fill="#111"/> 
      </g>
    </g>
  </defs>

  <!-- Option (A) - Rotated 0° -->
  <rect x="20" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="65.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(A)</text>
  <use href="#molecule_base" transform="translate(65, 63) rotate(0)" />

  <!-- Option (B) - Rotated 90° -->
  <rect x="126" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="171.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(B)</text>
  <use href="#molecule_base" transform="translate(171, 63) rotate(90)" />

  <!-- Option (C) [ODD ONE OUT] - Mirrored, Rotated 0° -->
  <rect x="232" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="277.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(C)</text>
  <use href="#molecule_mirror" transform="translate(277, 63) rotate(0)" />

  <!-- Option (D) - Rotated -135° -->
  <rect x="338" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="383.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(D)</text>
  <use href="#molecule_base" transform="translate(383, 63) rotate(-135)" />

  <!-- Option (E) - Rotated -45° -->
  <rect x="444" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="489.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(E)</text>
  <use href="#molecule_base" transform="translate(489, 63) rotate(-45)" />
</svg>
