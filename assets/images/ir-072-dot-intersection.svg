<svg viewBox="0 0 570 150" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Define the base dot pattern (as a group) -->
  <defs>
    <g id="dot_pattern_base">
      <circle cx="-20" cy="-20" r="5" fill="#aaa" stroke="#111" stroke-width="1"/> <!-- 1 -->
      <circle cx="20" cy="-20" r="5" fill="#aaa" stroke="#111" stroke-width="1"/>  <!-- 2 -->
      <circle cx="0" cy="0" r="5" fill="#aaa" stroke="#111" stroke-width="1"/>    <!-- 3 -->
      <circle cx="-15" cy="25" r="5" fill="#aaa" stroke="#111" stroke-width="1"/> <!-- 4 -->
      <circle cx="15" cy="25" r="5" fill="#aaa" stroke="#111" stroke-width="1"/>  <!-- 5 -->
    </g>
  </defs>

  <!-- Option (A) - Standard (3 connections) -->
  <rect x="20" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="65.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(A)</text>
  <use href="#dot_pattern_base" transform="translate(65, 63)" />
  <line x1="45" y1="43" x2="85" y2="43" stroke="#111" stroke-width="2"/> <!-- 1 to 2 -->
  <line x1="65" y1="63" x2="80" y2="88" stroke="#111" stroke-width="2"/> <!-- 3 to 5 -->
  <line x1="45" y1="43" x2="50" y2="88" stroke="#111" stroke-width="2"/> <!-- 1 to 4 -->

  <!-- Option (B) - Same pattern, rotated 45 deg (3 connections) -->
  <rect x="126" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="171.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(B)</text>
  <g transform="translate(171, 63) rotate(45)">
    <use href="#dot_pattern_base" />
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#111" stroke-width="2"/> <!-- 1 to 2 -->
    <line x1="0" y1="0" x2="15" y2="25" stroke="#111" stroke-width="2"/>    <!-- 3 to 5 -->
    <line x1="-20" y1="-20" x2="-15" y2="25" stroke="#111" stroke-width="2"/> <!-- 1 to 4 -->
  </g>

  <!-- Option (C) - Standard (3 connections) -->
  <rect x="232" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="277.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(C)</text>
  <use href="#dot_pattern_base" transform="translate(277, 63)" />
  <line x1="257" y1="43" x2="297" y2="43" stroke="#111" stroke-width="2"/> <!-- 1 to 2 -->
  <line x1="277" y1="63" x2="292" y2="88" stroke="#111" stroke-width="2"/> <!-- 3 to 5 -->
  <line x1="257" y1="43" x2="262" y2="88" stroke="#111" stroke-width="2"/> <!-- 1 to 4 -->

  <!-- Option (D) - Same pattern, flipped horizontally (3 connections) -->
  <rect x="338" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="383.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(D)</text>
  <g transform="translate(383, 63) scale(-1, 1)">
    <use href="#dot_pattern_base" />
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#111" stroke-width="2"/> <!-- 1 to 2 -->
    <line x1="0" y1="0" x2="15" y2="25" stroke="#111" stroke-width="2"/>    <!-- 3 to 5 -->
    <line x1="-20" y1="-20" x2="-15" y2="25" stroke="#111" stroke-width="2"/> <!-- 1 to 4 -->
  </g>

  <!-- Option (E) [INCORRECT] - 4 connections! -->
  <rect x="444" y="18" width="90" height="90" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="489.0" y="130" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" fill="#111">(E)</text>
  <use href="#dot_pattern_base" transform="translate(489, 63)" />
  <line x1="469" y1="43" x2="509" y2="43" stroke="#111" stroke-width="2"/> <!-- 1 to 2 -->
  <line x1="489" y1="63" x2="504" y2="88" stroke="#111" stroke-width="2"/> <!-- 3 to 5 -->
  <line x1="469" y1="43" x2="474" y2="88" stroke="#111" stroke-width="2"/> <!-- 1 to 4 -->
  <line x1="509" y1="43" x2="504" y2="88" stroke="#111" stroke-width="2"/> <!-- 2 to 5 [extra!] -->
</svg>
